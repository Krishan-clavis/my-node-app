apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-container
        image: 467839000245.dkr.ecr.us-east-1.amazonaws.com/nodejs/images:latest
        ports:
        - containerPort: 3000
      imagePullSecrets:
        - name: ecr-secret
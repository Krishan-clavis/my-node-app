
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Checking Node.js version..."
      - node --version
      - npm --version

  build:
    commands:
      - echo "Building Node.js application..."
      - npm run build --if-present
      - echo "Running tests..."
      - npm test --if-present

  post_build:
    commands:
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**/*
    - .git/**/*
    - .env
    - .env.*
    - .npmrc

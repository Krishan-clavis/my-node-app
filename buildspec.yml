version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 14
    commands:
      - echo Installing dependencies...
      - echo  store packages to artifacts
      - aws codeartifact login --tool npm --domain mydomain --domain-owner 467839000245 --repository mynpmrepo
      - npm install
  build:
    commands:
      - echo Build started...
  post_build:
    commands:
      - echo Build completed
artifacts:
  files:
    - '**/*'
